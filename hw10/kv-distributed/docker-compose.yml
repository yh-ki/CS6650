# docker-compose.yml
#
# Four cluster configurations, each as a named profile.
# Start one at a time:
#
#   docker compose --profile lf-w5-r1 up --build   # Leader-Follower W=5 R=1
#   docker compose --profile lf-w1-r5 up --build   # Leader-Follower W=1 R=5
#   docker compose --profile lf-w3-r3 up --build   # Leader-Follower W=3 R=3 (quorum)
#   docker compose --profile leaderless up --build  # Leaderless W=5 R=1
#
# All nodes in a profile share a dedicated Docker network so hostnames
# resolve automatically (e.g. "leader", "follower-1", "node-1").
#
# The leader/coordinator is always reachable from the host at port 8080.
# Individual followers/peers are at 8081-8084 for direct testing.

# ---------------------------------------------------------------------------
# Profile: lf-w5-r1  (Leader-Follower, synchronous writes, fast local reads)
# ---------------------------------------------------------------------------
services:

  lf-w5r1-leader:
    build: ./leader-follower
    profiles: [lf-w5-r1]
    networks: [lf-w5r1-net]
    hostname: leader
    ports:
      - "8080:8080"
    environment:
      ROLE: leader
      PORT: "8080"
      W: "5"
      R: "1"
      PEERS: >-
        http://follower-1:8080,
        http://follower-2:8080,
        http://follower-3:8080,
        http://follower-4:8080
    depends_on:
      - lf-w5r1-follower-1
      - lf-w5r1-follower-2
      - lf-w5r1-follower-3
      - lf-w5r1-follower-4

  lf-w5r1-follower-1:
    build: ./leader-follower
    profiles: [lf-w5-r1]
    networks: [lf-w5r1-net]
    hostname: follower-1
    ports:
      - "8081:8080"
    environment:
      ROLE: follower
      PORT: "8080"
      NODE_ID: "1"

  lf-w5r1-follower-2:
    build: ./leader-follower
    profiles: [lf-w5-r1]
    networks: [lf-w5r1-net]
    hostname: follower-2
    ports:
      - "8082:8080"
    environment:
      ROLE: follower
      PORT: "8080"
      NODE_ID: "2"

  lf-w5r1-follower-3:
    build: ./leader-follower
    profiles: [lf-w5-r1]
    networks: [lf-w5r1-net]
    hostname: follower-3
    ports:
      - "8083:8080"
    environment:
      ROLE: follower
      PORT: "8080"
      NODE_ID: "3"

  lf-w5r1-follower-4:
    build: ./leader-follower
    profiles: [lf-w5-r1]
    networks: [lf-w5r1-net]
    hostname: follower-4
    ports:
      - "8084:8080"
    environment:
      ROLE: follower
      PORT: "8080"
      NODE_ID: "4"

# ---------------------------------------------------------------------------
# Profile: lf-w1-r5  (Leader-Follower, async writes, read-all-pick-best)
# ---------------------------------------------------------------------------

  lf-w1r5-leader:
    build: ./leader-follower

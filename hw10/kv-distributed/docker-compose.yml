# ---------------------------------------------------------------------------
# Profile: leaderless  (any node is write coordinator, W=5 R=1)
# ---------------------------------------------------------------------------

  node-1:
    build: ./leaderless
    profiles: [leaderless]
    networks: [leaderless-net]
    hostname: node-1
    ports:
      - "8080:8080"
    environment:
      ROLE: leaderless
      PORT: "8080"
      NODE_ID: "1"
      W: "5"
      R: "1"
      PEERS: >-
        http://node-2:8080,
        http://node-3:8080,
        http://node-4:8080,
        http://node-5:8080

  node-2:
    build: ./leaderless
    profiles: [leaderless]
    networks: [leaderless-net]
    hostname: node-2
    ports:
      - "8081:8080"
    environment:
      ROLE: leaderless
      PORT: "8080"
      NODE_ID: "2"
      W: "5"
      R: "1"
      PEERS: >-
        http://node-1:8080,
        http://node-3:8080,
        http://node-4:8080,
        http://node-5:8080

  node-3:
    build: ./leaderless
    profiles: [leaderless]
    networks: [leaderless-net]
    hostname: node-3
    ports:
      - "8082:8080"
    environment:
      ROLE: leaderless
      PORT: "8080"
      NODE_ID: "3"
      W: "5"
      R: "1"
      PEERS: >-
        http://node-1:8080,
        http://node-2:8080,
        http://node-4:8080,
        http://node-5:8080

  node-4:
    build: ./leaderless
    profiles: [leaderless]
    networks: [leaderless-net]
    hostname: node-4
    ports:
      - "8083:8080"
    environment:
      ROLE: leaderless
      PORT: "8080"
      NODE_ID: "4"
      W: "5"
      R: "1"
      PEERS: >-
        http://node-1:8080,
        http://node-2:8080,
        http://node-3:8080,
        http://node-5:8080

  node-5:
    build: ./leaderless
    profiles: [leaderless]
    networks: [leaderless-net]
    hostname: node-5
    ports:
      - "8084:8080"
    environment:
      ROLE: leaderless
      PORT: "8080"
      NODE_ID: "5"
      W: "5"
      R: "1"
      PEERS: >-
        http://node-1:8080,
        http://node-2:8080,
        http://node-3:8080,
        http://node-4:8080

# ---------------------------------------------------------------------------
# Networks — one isolated bridge per profile so profiles don't interfere
# ---------------------------------------------------------------------------
networks:
  lf-w5r1-net:
    driver: bridge
  lf-w1r5-net:
    driver: bridge
  lf-w3r3-net:
    driver: bridge
  leaderless-net:
    driver: bridge

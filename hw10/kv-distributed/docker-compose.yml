        http://follower-2:8080,
        http://follower-3:8080,
        http://follower-4:8080
    depends_on:
      - lf-w1r5-follower-1
      - lf-w1r5-follower-2
      - lf-w1r5-follower-3
      - lf-w1r5-follower-4

  lf-w1r5-follower-1:
    build: ./leader-follower
